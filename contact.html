<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Q-SUCCEED-CNY</title>

  <style>
    *{ box-sizing: border-box; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:#0b1220;
      color:#e5e7eb;
      overflow-x:hidden;
    }

    /* NAV */
    .navbar{
      position: sticky;
      top: 0;
      z-index: 100;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding: 1rem 2rem;
      background: rgba(10, 17, 82, 0.45);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo{
      font-weight:800;
      letter-spacing:0.3px;
      color:#e5e7eb;
      font-size:1.25rem;
    }
    .navbar .desktop-nav a{
      margin-left: 1.6rem;
      text-decoration:none;
      color:#cbd5e1;
      font-weight:600;
    }
    .navbar .desktop-nav a:hover{ color:#ffffff; }

    /* BACKGROUND */
    .bg{
      position:relative;
      min-height: calc(100vh - 76px);
      padding: 4.5rem 1rem 6rem;
      background:
        radial-gradient(900px 500px at 15% 20%, rgba(79,70,229,0.35), transparent 60%),
        radial-gradient(900px 500px at 85% 35%, rgba(99,102,241,0.28), transparent 60%),
        radial-gradient(700px 450px at 45% 95%, rgba(199,210,254,0.22), transparent 60%),
        linear-gradient(180deg, #0b1220 0%, #0b1220 60%, #0a0f1c 100%);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .bg::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(circle at 50% 30%, rgba(0,0,0,0.9), transparent 70%);
      pointer-events:none;
      opacity:0.35;
    }

    /* Math grid overlay */
    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 39px,
          rgba(139, 92, 246, 0.15) 39px,
          rgba(139, 92, 246, 0.15) 40px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 39px,
          rgba(139, 92, 246, 0.15) 39px,
          rgba(139, 92, 246, 0.15) 40px
        ),
        linear-gradient(
          0deg,
          transparent 0,
          transparent calc(50% - 1px),
          rgba(167, 139, 250, 0.25) calc(50% - 1px),
          rgba(167, 139, 250, 0.25) calc(50% + 1px),
          transparent calc(50% + 1px)
        ),
        linear-gradient(
          90deg,
          transparent 0,
          transparent calc(50% - 1px),
          rgba(167, 139, 250, 0.25) calc(50% - 1px),
          rgba(167, 139, 250, 0.25) calc(50% + 1px),
          transparent calc(50% + 1px)
        );
      opacity: 0.4;
      pointer-events:none;
      mask-image: radial-gradient(circle at 50% 40%, rgba(0,0,0,0.8), transparent 75%);
    }

    .wrap{
      position:relative;
      z-index:1;
      width:100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 1rem;
      display:flex;
      justify-content:center;
    }
    .panel{
      width:100%;
      max-width: 760px;
      text-align:center;
      padding: 1.4rem 1rem 0;
    }

    /* Word cluster */
    .cluster{
      position:relative;
      display:inline-block;
      margin: 0.2rem 0 1.15rem;
      padding: 0.4rem 0.2rem;
    }
    .cluster .top{
      font-weight: 900;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      font-size: clamp(2.1rem, 5.8vw, 4rem);
      color: rgba(255,255,255,0.23);
      user-select:none;
    }
    .cluster .script{
      position:absolute;
      left: 0.1rem;
      bottom: -0.95rem;
      font-size: clamp(1.75rem, 4.8vw, 3.2rem);
      font-weight: 650;
      color: rgba(255,255,255,0.85);
      letter-spacing: -0.02em;
      transform: rotate(-2deg);
      user-select:none;
    }
    .cluster .tag{
      position:absolute;
      right: -1.3rem;
      bottom: -0.45rem;
      padding: 0.55rem 0.95rem;
      border-radius: 10px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.35);
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: clamp(0.85rem, 1.6vw, 1.05rem);
      color:#ffffff;
      transform: rotate(3deg);
      user-select:none;
    }

    .sub{
      margin: 1.25rem auto 1.2rem;
      max-width: 760px;
      color:#cbd5e1;
      line-height:1.7;
      font-size:1.05rem;
    }

    /* CTA button */
    .ctaRow{
      display:flex;
      justify-content:center;
      align-items:center;
      gap: 0.8rem;
      flex-wrap:wrap;
      margin-bottom: 1.35rem;
    }
    .ctaBtn{
      border:none;
      cursor:pointer;
      font-weight:900;
      color:#0b1220;
      background: linear-gradient(135deg, #c7d2fe, #a5b4fc);
      padding: 0.95rem 1.35rem;
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.35);
      display:inline-flex;
      align-items:center;
      gap: 0.6rem;
    }
    .ctaBtn:hover{ filter: brightness(1.05); }

    /* Contact */
    .card{
      max-width: 520px;
      width:100%;
      margin: 0 auto;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 1.25rem 1.25rem 1.4rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.50);
      text-align:left;

      display:none;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity .18s ease, transform .18s ease;
      position: relative;
      overflow: hidden;
    }
    .card.show{
      display:block;
      opacity: 1;
      transform: translateY(0);
    }

    /* Envelope lines */
    .card::before{
      content:"";
      position:absolute;
      inset:-40px;
      background:
        linear-gradient(135deg,
          transparent 0 48%,
          rgba(255,255,255,0.10) 48% 49%,
          transparent 49% 100%),
        linear-gradient(225deg,
          transparent 0 48%,
          rgba(255,255,255,0.10) 48% 49%,
          transparent 49% 100%);
      pointer-events:none;
      opacity:0.55;
      transform: rotate(0deg);
    }
    .card::after{
      content:"";
      position:absolute;
      left: 18px;
      right: 18px;
      top: 58px;
      height: 1px;
      background: rgba(255,255,255,0.12);
      pointer-events:none;
    }

    .cardTitle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 1rem;
      margin-bottom: 0.85rem;
      position:relative;
      z-index:1;
    }
    .cardTitle h2{
      margin:0;
      font-size: 1.15rem;
      color:#ffffff;
      letter-spacing:-0.01em;
      display:flex;
      align-items:center;
      gap: 0.6rem;
    }
    .stamp{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px dashed rgba(199,210,254,0.55);
      background: rgba(199,210,254,0.10);
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      color: rgba(199,210,254,0.95);
      font-size: 0.9rem;
    }

    .closeMini{
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color:#e5e7eb;
      border-radius: 10px;
      padding: 0.35rem 0.6rem;
      cursor:pointer;
      font-weight: 800;
      font-size: 0.8rem;
      position:relative;
      z-index:1;
    }
    .closeMini:hover{ filter: brightness(1.1); }

    .formArea{
      position:relative;
      z-index:1;
    }

    label{
      display:block;
      font-size: 0.8rem;
      color:#cbd5e1;
      margin: 0.45rem 0 0.25rem;
      font-weight:600;
    }
    input, textarea{
      width:100%;
      max-width:100%;
      padding: 0.65rem 0.75rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color:#ffffff;
      outline:none;
      font-size:0.9rem;
    }
    textarea{
      min-height: 90px;
      resize: vertical;
    }
    input:focus, textarea:focus{
      border-color: rgba(199,210,254,0.65);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.18);
    }

    .sendBtn{
      margin-top: 0.9rem;
      border:none;
      width:100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-weight: 900;
      cursor:pointer;
      color:#0b1220;
      background: linear-gradient(135deg, #c7d2fe, #a5b4fc);
    }
    .sendBtn:hover{ filter: brightness(1.05); }

    .status{
      margin-top: 0.75rem;
      font-size:0.95rem;
      min-height:1.2rem;
      color:#cbd5e1;
      position:relative;
      z-index:1;
    }
    .status.ok{ color:#a7f3d0; }
    .status.err{ color:#fecaca; }

    @media (max-width: 820px){
      .navbar{ padding: 1rem 1.2rem; }
      .cluster .tag{ right: -0.6rem; }
    }

    /* ===== HAMBURGER BUTTON ===== */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      z-index: 101;
    }
    .hamburger span {
      display: block;
      width: 25px;
      height: 3px;
      background: #cbd5e1;
      border-radius: 2px;
      transition: 0.3s ease;
    }

    /* ===== MOBILE MENU OVERLAY ===== */
    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 280px;
      height: 100vh;
      background: #0b1220;
      box-shadow: -4px 0 20px rgba(0,0,0,0.4);
      z-index: 1000;
      transition: right 0.3s ease;
      padding: 30px;
    }
    .mobile-menu.active { right: 0; }
    .mobile-menu-close {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 32px;
      background: none;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
    }
    .mobile-menu nav {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
    }
    .mobile-menu nav a {
      display: block;
      padding: 14px 0;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      transition: color 0.3s ease;
    }
    .mobile-menu nav a:hover { color: #fff; }

    @media (max-width: 768px) {
      .desktop-nav { display: none; }
      .hamburger { display: flex; }
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="logo">Q-SUCCEED-CNY</div>
  <nav class="desktop-nav">
    <a href="index.html">Home</a>
    <a href="news.html">News</a>
    <a href="lectures.html">Lectures/Labs</a>
    <a href="about.html">About</a>
    <a href="north/north.html" title="Q-SUCCEED-North (Watertown, NY)">Watertown</a>
    <a href="contact.html">Contact</a>
    <a href="apply.html">Apply</a>
  </nav>
  <button class="hamburger" aria-label="Menu" onclick="document.querySelector('.mobile-menu').classList.add('active')">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="mobile-menu">
  <button class="mobile-menu-close" onclick="this.parentElement.classList.remove('active')">&times;</button>
  <nav>
    <a href="index.html">Home</a>
    <a href="news.html">News</a>
    <a href="lectures.html">Lectures/Labs</a>
    <a href="about.html">About</a>
    <a href="north/north.html" title="Q-SUCCEED-North (Watertown, NY)">Watertown</a>
    <a href="contact.html">Contact</a>
    <a href="apply.html">Apply</a>
  </nav>
</div>

<main class="bg">
  <div class="wrap">
    <section class="panel">

      <div class="cluster" aria-hidden="true">
        <div class="top">zdravo</div>
        <div class="script">hola</div>
        <div class="tag">hello</div>
      </div>

      <div class="sub">
        Got questions?
      </div>

      <div class="ctaRow">
        <button class="ctaBtn" id="toggleCardBtn" type="button">✎ Contact Us</button>
      </div>

      <section class="card" id="contactCard">
        <div class="cardTitle">
          <h2><span class="stamp">✉</span> Send a message</h2>
          <button class="closeMini" type="button" id="closeCardBtn">Close</button>
        </div>

        <div class="formArea">
          <form
            id="gform"
            action="https://docs.google.com/forms/d/e/1FAIpQLScDwhgoYEADDGsf0p-DAQ06-XNWjWpfSTaF_Vju6WtFEnTm6Q/formResponse"
            method="POST"
            target="hidden_iframe"
          >
            <label for="name">Name</label>
            <input id="name" name="entry.1838330447" required />

            <label for="email">Email</label>
            <input id="email" type="email" name="entry.1834008358" required />

            <label for="message">Message</label>
            <textarea id="message" name="entry.1700302622" required></textarea>

            <button class="sendBtn" type="submit">Send</button>
            <div class="status" id="statusText"></div>
          </form>

          <iframe name="hidden_iframe" style="display:none;"></iframe>
        </div>
      </section>

    </section>
  </div>
</main>

<script>
  const card = document.getElementById("contactCard");
  const toggleBtn = document.getElementById("toggleCardBtn");
  const closeBtn = document.getElementById("closeCardBtn");

  function openCard(){
    card.classList.add("show");
    setTimeout(() => document.getElementById("name").focus(), 0);
  }
  function closeCard(){
    card.classList.remove("show");
  }

  toggleBtn.addEventListener("click", () => {
    if (card.classList.contains("show")) closeCard();
    else openCard();
  });

  closeBtn.addEventListener("click", closeCard);

  // Direct submit feedback
  const form = document.getElementById("gform");
  const statusText = document.getElementById("statusText");

  form.addEventListener("submit", () => {
    statusText.textContent = "Sending...";
    statusText.className = "status";
    setTimeout(() => {
      statusText.textContent = "✅ Message sent. Thank you!";
      statusText.className = "status ok";
      form.reset();
    }, 900);
  });
</script>

</body>
</html>
